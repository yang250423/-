name: Enable GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  administration: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Pages from main
        id: enable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          REPO="${{ github.repository }}"
          echo "=== current ==="
          gh api "repos/${REPO}/pages" || true
          echo "=== create legacy ==="
          gh api --method POST "repos/${REPO}/pages" \
            -f build_type=legacy \
            -f source[branch]='${{ github.ref_name }}' \
            -f source[path]=/ || true
          echo "=== update legacy ==="
          gh api --method PUT "repos/${REPO}/pages" \
            -f build_type=legacy \
            -f source[branch]='${{ github.ref_name }}' \
            -f source[path]=/ || true
          echo "=== public visibility ==="
          gh api --method PUT "repos/${REPO}/pages" -F public=true || true
          BUILD_TYPE="$(gh api "repos/${REPO}/pages" --jq '.build_type' 2>/dev/null || echo missing)"
          HTML_URL="$(gh api "repos/${REPO}/pages" --jq '.html_url' 2>/dev/null || echo "")"
          echo "build_type=${BUILD_TYPE}"
          echo "html_url=${HTML_URL}"
          echo "build_type=${BUILD_TYPE}" >> "$GITHUB_OUTPUT"
          echo "html_url=${HTML_URL}" >> "$GITHUB_OUTPUT"
          if [ "${BUILD_TYPE}" = "legacy" ]; then
            echo "=== request build ==="
            gh api --method POST "repos/${REPO}/pages/builds" || true
          fi

      - name: Stage site
        if: steps.enable.outputs.build_type != 'legacy'
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Switch Pages to GitHub Actions
        if: steps.enable.outputs.build_type != 'legacy'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          REPO="${{ github.repository }}"
          gh api --method POST "repos/${REPO}/pages" -f build_type=workflow || true
          gh api --method PUT "repos/${REPO}/pages" -f build_type=workflow || true
          gh api "repos/${REPO}/pages" || true

      - name: Setup Pages
        if: steps.enable.outputs.build_type != 'legacy'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.enable.outputs.build_type != 'legacy'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.enable.outputs.build_type != 'legacy'
        id: deployment
        uses: actions/deploy-pages@v4
