<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>市场监管总局：七平台幽灵外卖案处罚通报</title><link rel="stylesheet" href="../style.css"/></head><body><div class="wrap"><header class="site"><div class="brand"><a href="../">本分：黄峥这个人</a></div><p class="sub">HZ045 · 监管机关原文摘要</p></header><article class="source-card"><h1>市场监管总局：七平台幽灵外卖案处罚通报</h1><p>发表／提交日期：2026-04-17 · 本轮核验：2026-10-19</p><p><a href="https://www.samr.gov.cn/xw/zj/art/2026/art_9714ee2bef9244819134ef4ffdd14017.html">原始来源</a></p><h2>可支持的内容</h2><p>通报将上海寻梦信息技术有限公司（拼多多）列为七家被处罚平台之一，并给出行政处罚决定书附件入口。正文公布七平台罚没款合计35.97亿元。</p><h2>证据边界</h2><p>合计金额覆盖七家平台，不能当作拼多多一家或黄峥个人罚款。本摘要未逐一复核附件中的各主体金额，正文仅按通报确认处罚主体与事件。</p><p class="note">保留来源归属，只提供短摘要与定位；原文版权归原发布者。</p></article><footer><a href="index.html">站内材料目录</a> · <a href="../dossier.html#sources">资料库</a></footer></div></body></html>
